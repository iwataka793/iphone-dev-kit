# PC を見て・動かす道具（pc-mcp.exe ＝ 拡張機能、pc-agent.exe ＝ 常駐役）をビルドし、
# GitHub の Windows で通しの試験をしてから、Releases に pc-N として置く。
name: pc-mcp build

on:
  push:
    # stage/ のブランチは試験だけ（入れ直し用の pc-N は main だけが作る。release の段は main のときだけ）
    branches: [main, "stage/**"]
    paths:
      - "tools/pc-mcp/**"
      - "tools/switch-app/**"
      - "tools/hands-window/**"
      - "tools/switch-window/**"
      - ".github/workflows/pc-mcp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pc-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - name: 依存を揃える
        run: go mod tidy
      - name: 確かめる（vet）
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Go の試験（全部。箱・TRY・ネットの守りの試験も。名前で決め打ちすると新しい試験が漏れるので）
        run: go test -count=1 -v .
      - name: 起動の試験（Linux。常駐役なし＝オフ）
        run: |
          go build -o /tmp/pc-linux .
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"pc_status","arguments":{}}}' \
            > /tmp/in.jsonl
          (cat /tmp/in.jsonl; sleep 2) | PC_AGENT_DIR=/tmp/pcstate timeout 15 /tmp/pc-linux > /tmp/out.jsonl || true
          python3 - <<'PY'
          import json
          rs = {}
          for l in open("/tmp/out.jsonl"):
              if l.strip():
                  m = json.loads(l)
                  if "id" in m: rs[m["id"]] = m
          tools = [t["name"] for t in rs[2]["result"]["tools"]]
          print("道具:", tools)
          assert len(tools) == 21, tools
          st = rs[3]["result"]["content"][0]["text"]
          print(st)
          assert "動いていない" in st
          PY
      - name: Windows 用にビルド
        run: |
          V="0.1.${{ github.run_number }}+${GITHUB_SHA::7}"
          mkdir -p pkg/server sw
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$V" -o pkg/server/pc-mcp.exe .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$V" -o sw/pc-agent.exe .
          cp switch/*.bat switch/*.ps1 sw/
          # LIVE の窓（Go ＋ Wails。Windows では C のコンパイラが要らない）
          (cd ../hands-window && go mod tidy && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags desktop,production -ldflags "-s -w -H windowsgui -X main.version=$V" -o ../pc-mcp/sw/claude-hands-live.exe .)
          # スイッチと「許可しますか？」の窓（同じく Go ＋ Wails）。先に中身（頼みの受け付け）の試験
          (mkdir -p /tmp/swc && cp ../switch-window/core.go ../switch-window/core_test.go /tmp/swc/ && cd /tmp/swc && printf 'package main\n\nvar version = "t"\n\nfunc main() {}\n' > stub.go && printf 'module swc\n\ngo 1.24\n' > go.mod && go test -v . )
          (cd ../switch-window && go mod tidy && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags desktop,production -ldflags "-s -w -H windowsgui -X main.version=$V" -o ../pc-mcp/sw/claude-hands-switch.exe .)
          cp ../switch-app/devkit-switch.ps1 ../switch-app/devkit-switch.vbs ../switch-app/devkit-switch.ico sw/
          ls -la pkg/server sw
      - name: 拡張機能（.mcpb）とスイッチにまとめる
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("manifest.json", encoding="utf-8"))
          m["version"] = "0.1.${{ github.run_number }}"
          json.dump(m, open("pkg/manifest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          npx -y @anthropic-ai/mcpb validate pkg/manifest.json
          npx -y @anthropic-ai/mcpb pack pkg claude-hands-pc.mcpb
          (cd sw && zip -q ../pc-switch.zip *)
          ls -la claude-hands-pc.mcpb pc-switch.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pc-mcp
          path: |
            tools/pc-mcp/claude-hands-pc.mcpb
            tools/pc-mcp/pc-switch.zip
            tools/pc-mcp/pkg/server/pc-mcp.exe
            tools/pc-mcp/sw/pc-agent.exe
            tools/pc-mcp/sw/claude-hands-live.exe
            tools/pc-mcp/sw/claude-hands-switch.exe

  wintest:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pc-mcp
          path: art
      - name: スイッチの窓の台本と見た目（XAML）が読めるか
        shell: powershell
        run: |
          Add-Type -AssemblyName PresentationFramework
          $f = (Resolve-Path tools/switch-app/devkit-switch.ps1).Path
          $tok = $null; $err = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tok, [ref]$err)
          if ($err.Count) { $err | ForEach-Object { $_.ToString() }; exit 1 }
          $src = Get-Content $f -Raw -Encoding UTF8
          $ms = [regex]::Matches($src, "(?s)\[xml\]\`$\w+ = @'\r?\n(.*?)\r?\n'@")
          foreach ($m in $ms) { $x = [xml]$m.Groups[1].Value; $w = [Windows.Markup.XamlReader]::Load((New-Object System.Xml.XmlNodeReader $x)); "XAML OK: $($w.GetType().Name) $($w.Title)" }
          if ($ms.Count -lt 2) { "XAML not found"; exit 1 }
      - name: 守りの場所の台本が読めるか（UTF-8 の BOM 付き）
        shell: powershell
        run: |
          foreach ($n in 'hands-protect.ps1','hands-daily.ps1','box-check.ps1','box-closed.ps1') {
            $f = (Resolve-Path "tools/pc-mcp/switch/$n").Path
            $b = [IO.File]::ReadAllBytes($f)
            if (-not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { "no BOM: $n"; exit 1 }
            $tok = $null; $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tok, [ref]$err)
            if ($err.Count) { $err | ForEach-Object { $_.ToString() }; exit 1 }
            "OK: $n"
          }
      - name: 箱から見せない場所の一覧に、鍵・資格情報・トークンの場所が入っているか（box-closed.ps1）
        shell: powershell
        run: |
          # この台本は BOM なしで渡されるので、Windows PowerShell 5.1 が読めるよう英数字だけで書く
          . (Resolve-Path "tools/pc-mcp/switch/box-closed.ps1").Path
          $l = @(ClaudeBoxClosed 'C:\Users\u' 'C:\ProgramData\claude-hands')
          "closed places: $($l.Count)"
          foreach ($want in '.ssh', 'Microsoft\Credentials', 'Microsoft\Protect', 'GitHub CLI', 'gcloud', '.git-credentials', 'Chrome\User Data', 'claude-hands') {
            if (-not ($l | Where-Object { $_[1] -like "*$want*" })) { "missing: $want"; exit 1 }
          }
          if (@($l | ForEach-Object { $_[1] } | Sort-Object -Unique).Count -ne $l.Count) { "duplicate places"; exit 1 }
      - name: LIVE の窓が出るか（フォーカスを取らない・右下）
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'livehome'
          New-Item -ItemType Directory -Force -Path "$h/devkit/pc-agent", "$h/devkit/hands/timeline" | Out-Null
          Set-Content "$h/devkit/pc-agent/mode.txt" 'operate'
          $now = (Get-Date).ToString('o')
          Set-Content "$h/devkit/hands/timeline/$((Get-Date).ToString('yyyy-MM-dd')).jsonl" "{`"t`":`"$now`",`"hand`":`"pc`",`"tool`":`"pc_trash`",`"ok`":true}"
          Set-Content "$h/devkit/hands/task.json" '{"id":"x","title":"CI test","start":"2026-01-01T00:00:00Z"}'
          $rep = Join-Path $env:RUNNER_TEMP 'live-report.json'
          $env:HANDS_HOME = $h; $env:HANDS_LIVE_TEST = $rep
          $np = Start-Process notepad.exe -PassThru; Start-Sleep 3   # カオルの PC と同じく、先にほかの窓を前に出しておく
          $p = Start-Process (Resolve-Path art/sw/claude-hands-live.exe).Path -PassThru
          $p | Wait-Process -Timeout 40 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p | Stop-Process -Force }
          if (-not (Test-Path $rep)) { "no report"; exit 1 }
          $r = Get-Content $rep | ConvertFrom-Json
          $r | ConvertTo-Json -Compress
          $np | Stop-Process -Force -ErrorAction SilentlyContinue
          # 出す前に別の窓が前にあったのに、LIVE が前を取ったら失敗（前に何も無いときは試験の機械の都合なので見ない）
          $took = $r.foregroundIsLive -and $r.initForeground
          if (-not ($r.found -and $r.visible -and $r.noActivate -and $r.toolWindow -and $r.topmost) -or $took) { "LIVE window check failed"; exit 1 }
      - name: スイッチの窓が頼みを出すか（真ん中・いちばん前・フォーカスは取らない・時間切れの返事）
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'swhome'
          New-Item -ItemType Directory -Force -Path "$h/devkit/requests", "$h/devkit/hands", "$h/devkit/pc-agent" | Out-Null
          Set-Content "$h/devkit/pc-agent/mode.txt" 'off'
          $rep = Join-Path $env:RUNNER_TEMP 'switch-report.json'
          $env:HANDS_HOME = $h; $env:HANDS_ALLOW_DIR = Join-Path $env:RUNNER_TEMP 'swallow'; $env:HANDS_SWITCH_TEST = $rep
          $np = Start-Process notepad.exe -PassThru; Start-Sleep 3
          $req = "$h/devkit/requests/pc-operate.txt"
          Set-Content $req '{"kind":"pc-operate","what":"PC test","why":"CI test","tool":"pc_ui_do","from":"ci"}'
          (Get-Item $req).LastWriteTime = (Get-Date).AddSeconds(-44)   # 残り 11 秒：5 秒で出ていて、12 秒までに時間切れ
          $p = Start-Process (Resolve-Path art/sw/claude-hands-switch.exe).Path -ArgumentList '/tray' -PassThru
          $p | Wait-Process -Timeout 50 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { "did not quit"; $p | Stop-Process -Force; exit 1 }
          $np | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $rep)) { "no report"; exit 1 }
          $r = Get-Content $rep | ConvertFrom-Json
          $r | ConvertTo-Json -Compress
          $ans = "$h/devkit/requests/pc-operate.answer.json"
          if (Test-Path $ans) { Get-Content $ans } else { "no answer file" }
          Get-Content "$h/devkit/hands/asks.jsonl" -ErrorAction SilentlyContinue
          $took = $r.foregroundIsSwitch -and $r.initForeground
          if (-not ($r.found -and $r.visible -and $r.shown -eq 'ask' -and $r.topmost) -or $took) { "SWITCH window check failed"; exit 1 }
          if (-not ((Test-Path $ans) -and ((Get-Content $ans -Raw) -match '"timeout"'))) { "timeout answer missing"; exit 1 }
          if (Test-Path $req) { "request not taken"; exit 1 }
      - name: TRY の窓が出るか（箱で試した結果・返事待ち）
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'tryhome'
          New-Item -ItemType Directory -Force -Path "$h/devkit/pc-agent", "$h/devkit/hands/try" | Out-Null
          Set-Content "$h/devkit/pc-agent/mode.txt" 'off'
          $j = @{ id='t1'; path="$h\devkit\downloads\setup.exe"; defender='見つからなかった'; items=@(@{kind='new'; real="$h\devkit\downloads\a.txt"; size=3}); status='waiting' } | ConvertTo-Json -Depth 4
          Set-Content "$h/devkit/hands/try/current.json" $j -Encoding UTF8
          $rep = Join-Path $env:RUNNER_TEMP 'try-report.json'
          $env:HANDS_HOME = $h; $env:HANDS_LIVE_TEST = $rep
          $p = Start-Process (Resolve-Path art/sw/claude-hands-live.exe).Path -PassThru
          $p | Wait-Process -Timeout 40 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p | Stop-Process -Force }
          if (-not (Test-Path $rep)) { "no report"; exit 1 }
          $r = Get-Content $rep | ConvertFrom-Json
          $r | ConvertTo-Json -Compress
          if (-not ($r.found -and $r.visible)) { "TRY window check failed"; exit 1 }
      - name: 通しの試験（本物の Windows）
        shell: pwsh
        run: |
          Get-ChildItem -Recurse art | Select-Object FullName, Length | Format-Table -AutoSize
          $env:PCMCP = (Resolve-Path art/pkg/server/pc-mcp.exe).Path
          $env:PCAGENT = (Resolve-Path art/sw/pc-agent.exe).Path
          $env:PC_AGENT_DIR = Join-Path $env:RUNNER_TEMP 'pcstate'
          $env:PC_AGENT_ALLOW_DIR = Join-Path $env:RUNNER_TEMP 'pcallow'
          $env:PYTHONIOENCODING = 'utf-8'
          $env:DEVKIT_NO_ASK = '1'
          python tools/pc-mcp/test/scenario.py
      - name: 常駐役の記録
        if: always()
        shell: pwsh
        run: |
          Get-Content (Join-Path $env:RUNNER_TEMP 'pcstate/audit.log') -Encoding utf8 -ErrorAction SilentlyContinue | Select-Object -Last 60
          Get-Content (Join-Path $env:RUNNER_TEMP 'pcstate/agent.log') -ErrorAction SilentlyContinue | Select-Object -Last 20

  release:
    needs: [build, wintest]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pc-mcp
          path: art
      - name: Releases に置く（最新版にはしない）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pc-${{ github.run_number }}"
          gh release create "$TAG" art/claude-hands-pc.mcpb art/pc-switch.zip -R "${{ github.repository }}" \
            --title "PC の道具 $TAG" \
            --notes "claude-hands-pc.mcpb：Claude デスクトップの拡張機能（設定 → デスクトップアプリ → 拡張機能 にドラッグ）。pc-switch.zip：常駐役（pc-agent.exe）とスイッチ。開いて pc-setup.bat を実行。commit ${GITHUB_SHA::7}" \
            --latest=false
